<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>卡牌比大小</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@300;400;500;700&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            font-weight: 300;
            text-align: center;
            background: linear-gradient(135deg, #1a233a 0%, #2c3e50 100%);
            color: #2D3748;
            margin: 0;
            padding: 10px;
            font-size: 16px;
            min-height: 100vh;
        }
        .box {
            margin: 10px auto;
            padding: 20px;
            width: 100%;
            max-width: 520px;
            background: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
            border: 4px solid #FFCB05;
        }
        input {
            padding: 12px; margin: 8px auto; width: 50%; display: block;
            background-color: #F4F6F8; border: 2px solid #CBD5E0;
            border-radius: 12px; font-size: 18px; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 300;
            outline: none; transition: border-color 0.2s;
            text-align: center;
        }
        input:focus { border-color: #3B4CCA; }
        button {
            padding: 12px 18px; margin: 6px 4px; background-color: #3B4CCA;
            color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 400;
            font-family: 'Zen Maru Gothic', sans-serif; cursor: pointer; box-shadow: 0 4px 10px rgba(59, 76, 202, 0.3);
            transition: transform 0.1s, background-color 0.2s;
        }
        button:hover { background-color: #2a379c; transform: translateY(-1px); }
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            background: #F7F9FA; margin: 8px auto; padding: 10px 14px; width: 100%;
            border-radius: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 16px; font-weight: 300;
            border: 1px solid #E2E8F0;
        }
        li.clickable-player {
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }
        li.clickable-player:hover {
            background-color: #EBF8FF;
            border-color: #3182CE;
        }
        li.selected-target {
            background-color: #FEFCBF !important;
            border: 2px solid #D69E2E !important;
        }
        #card-display {
            margin-top: 10px; background: #FFF9E6; padding: 12px; border-radius: 16px;
            display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 10px; color: #975A16; font-size: 18px; font-weight: 300;
            border: none;
        }

        /* 圓框不加粗，但具備完整漸層與精緻陰影、層次 */
        .card-container-wrapper {
            position: relative;
            width: 176px;
            height: 176px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35), 
                        inset 0 4px 8px rgba(255, 255, 255, 0.6), 
                        inset 0 -4px 8px rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
            padding: 2px; /* 維持纖細邊框 */
        }

        .card-container-wrapper::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.7); /* 纖細邊框不加粗 */
            box-shadow: 0 0 8px rgba(0,0,0,0.25);
        }

        .card-container-wrapper .pokemon-card-img {
            position: relative;
            z-index: 1;
            width: 164px;
            height: 164px;
            border-radius: 50%;
            object-fit: cover;
            background: #fff;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.25), 0 4px 10px rgba(0,0,0,0.2);
        }

        /* 各屬性漸層底色與陰影配置 */
        .bg-rabbit::before { background: linear-gradient(135deg, #a0aec0, #cbd5e0); }
        .bg-snake::before { background: linear-gradient(135deg, #3182ce, #63b3ed); }
        .bg-fox::before { background: linear-gradient(135deg, #38a169, #68d391); }
        .bg-wolf::before { background: linear-gradient(135deg, #d69e2e, #f6e05e); }
        .bg-leopard::before { background: linear-gradient(135deg, #dd6b20, #fbd38d); }
        .bg-lion::before { background: linear-gradient(135deg, #e53e3e, #fc8181); }
        .bg-bear::before { background: linear-gradient(135deg, #e2e8f0, #ffffff, #a0aec0); border: 1px solid #cbd5e0; }
        .bg-tiger::before { background: linear-gradient(135deg, #d4af37, #f6e05e, #aa771c); }
        .bg-hunter::before { background: linear-gradient(135deg, #1a202c, #4a5568, #d4af37); }
        .bg-virus::before { background: linear-gradient(135deg, #654321, #3d2314, #1a0f07); box-shadow: inset 0 0 10px rgba(0,0,0,0.8); }

        .din-score {
            font-family: 'DIN', 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 44px;
            color: #9C4A4A;
            line-height: 1;
            letter-spacing: 0.5px;
        }

        .pokemon-name {
            font-size: 20px;
            font-weight: 500;
            color: #2D3748;
            letter-spacing: 0.5px;
        }

        .list-score-tag {
            font-family: 'DIN', 'Montserrat', sans-serif;
            font-weight: 900;
            color: #9C4A4A;
            font-size: 1.4em;
            display: inline-block;
        }

        .list-player-name {
            font-size: 1rem;
            font-weight: 500;
            margin-left: 6px;
            color: #2D3748;
        }

        .list-right-group {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .list-total-score {
            font-size: 1rem;
            font-weight: 700;
            color: #3182CE;
            font-family: 'Zen Maru Gothic', sans-serif;
            letter-spacing: 0.5px;
        }

        /* 列表中的迷你圓形圖示也加入漸層與精緻陰影 */
        li .pokemon-mini-container {
            width: 52px; 
            height: 52px; 
            border-radius: 50%; 
            overflow: hidden;
            display: inline-block;
            vertical-align: middle; 
            margin-right: 4px; 
            background: #fff; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
            flex-shrink: 0;
        }

        li .pokemon-mini-img {
            width: 52px; 
            height: 52px; 
            object-fit: cover;
        }

        #battle-log {
            margin-top: 12px; font-size: 16px; font-weight: 300; color: #4A5568; background: #F7F9FA;
            padding: 14px; border-radius: 12px; text-align: left; max-height: 150px; overflow-y: auto;
            border: 1px solid #E2E8F0;
            line-height: 1.6;
        }
        .room-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #F4F6F8; padding: 10px; margin: 6px 0; border-radius: 10px;
        }
        .turn-highlight { border: 2px solid #FFCB05 !important; background-color: #FFFFF0 !important; }
        
        .header-logo-container {
            margin: 10px auto 15px auto;
            width: 100%;
            max-width: 520px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <div style="position: fixed; top: 10px; right: 10px; z-index: 100;">
        <button id="music-toggle-btn" onclick="toggleBGM()" style="background-color: #3B4CCA; font-size: 13px; padding: 6px 12px;">開啟音樂</button>
    </div>

    <div id="login-box" class="box">
        <div class="header-logo-container">
            <img src="/bite-game/0.png" alt="首頁主視覺" style="width: 100%; max-width: 520px; height: auto; display: block; border-radius: 18px;">
        </div>
        <input type="text" id="player-name" placeholder="寶可夢訓練家"><br>
        <button onclick="createRoom()" style="background-color: #CC0000; width: 50%;">建立新房間</button>
        
        <div style="margin: 15px 0; border-top: 2px dashed #CBD5E0;"></div>
        <p style="margin-bottom: 5px; font-weight: 400;">對戰列表</p>
        <div id="room-list-container" style="max-height: 160px; overflow-y: auto; padding: 5px;">
            <p style="color: #A0AEC0; font-size: 14px;">目前沒有等待中的房間...</p>
        </div>
    </div>

    <div id="game-box" class="box" style="display:none;">
        
        <div id="card-display">
            等待遊戲開始...
        </div>

        <div id="fox-status-banner" style="margin-top: 4px; font-size: 14px; color: #D69E2E; font-weight: 400;"></div>

        <ul id="game-player-list" style="margin-top: 10px;"></ul>

        <div id="action-panel" style="display:none; margin-top: 10px; background: #EDF2F7; padding: 12px; border-radius: 14px; border: 1px solid #CBD5E0;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                <p id="target-instruction" style="margin:0; font-size:14px; font-weight: 400; color: #2B6CB0; text-align: left;">
                    <img src="/bite-game/hit.png" style="width: 18px; height: 18px; vertical-align: middle; margin-right: 4px;" alt="hit"> 選擇對手
                </p>
                <span id="timer-text" style="font-size: 15px; font-weight: 700; color: #E53E3E; white-space: nowrap; margin-left: 8px;">10s</span>
            </div>
            <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;">
                <button onclick="sendAction('attack')" style="background-color: #DD6B20; flex: 1; min-width: 40%;">單挑</button>
                <button onclick="sendAction('group_attack')" style="background-color: #E53E3E; flex: 1; min-width: 40%;">圍毆</button>
                <button onclick="sendAction('discard')" style="background-color: #3182CE; flex: 1; min-width: 40%;">換牌(-1分)</button>
                <button onclick="sendAction('pass')" style="background-color: #718096; flex: 1; min-width: 40%;">Pass</button>
            </div>
        </div>

        <div id="group-vote-panel" style="display:none; margin-top:10px; background:#FEFCBF; padding:12px; border-radius:14px; border: 1px solid #ECC94B;">
            <p id="group-vote-text" style="margin:0 0 4px 0; font-size:15px; font-weight: 400; color: #744210;"></p>
            <p id="group-timer-text" style="margin:0 0 6px 0; font-size:13px; color:#E53E3E; font-weight: 400;">剩餘考慮時間：5 秒</p>
            <div id="vote-buttons" style="display:none;">
                <button onclick="voteGroup(true)" style="background-color: #38A169;">參加</button>
                <button onclick="voteGroup(false)" style="background-color: #E53E3E;">不參加</button>
            </div>
        </div>

        <div id="host-controls" style="display:none; margin-top: 10px;">
            <button onclick="startGame()" style="background-color: #38A169; width: 100%; font-size: 18px;">開始遊戲</button>
        </div>

        <div id="battle-log">遊戲記錄：等待開始...</div>
    </div>

    <!-- 結算畫面 Modal 容器 -->
    <div id="game-over-modal" style="display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: #fff; padding: 25px; border-radius: 20px; width: 90%; max-width: 480px; max-height: 85vh; overflow-y: auto; text-align: left; border: 4px solid #FFCB05;">
            <h2 style="text-align: center; color: #2C3E50; margin-top: 0;">🏆 最終結算排名</h2>
            <div id="game-over-list" style="margin-top: 15px;"></div>
            <button onclick="location.reload()" style="width: 100%; margin-top: 20px; background-color: #3B4CCA; font-size: 16px;">返回大廳</button>
        </div>
    </div>

    <script>
        const socket = io();
        let myRoomCode = '', myId = '', currentTurnId = '', cachedPlayers = [];
        let selectedTargetId = null; 
        let turnTimer = null, countdownTimer = null, groupVoteTimer = null, groupCountdownTimer = null;
        let timeLeft = 10, groupTimeLeft = 5;

        let bgmPlaying = false;
        let bgmInterval = null;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        const pokemonDataMapping = {
            "1分牌": { img: "/bite-game/1.png", points: 1, pokemonName: "可達鴨", displayNo: "1", bgClass: "bg-rabbit" },
            "2分牌": { img: "/bite-game/2.png", points: 2, pokemonName: "妙蛙種子", displayNo: "2", bgClass: "bg-snake" },
            "3分牌": { img: "/bite-game/3.png", points: 3, pokemonName: "伊布", displayNo: "3", bgClass: "bg-fox" },
            "4分牌": { img: "/bite-game/4.png", points: 4, pokemonName: "路卡利歐", displayNo: "4", bgClass: "bg-wolf" },
            "5分牌": { img: "/bite-game/5.png", points: 5, pokemonName: "皮卡丘", displayNo: "5", bgClass: "bg-leopard" },
            "6分牌": { img: "/bite-game/6.png", points: 6, pokemonName: "噴火龍", displayNo: "6", bgClass: "bg-lion" },
            "7分牌": { img: "/bite-game/7.png", points: 7, pokemonName: "卡比獸", displayNo: "7", bgClass: "bg-bear" },
            "8分牌": { img: "/bite-game/8.png", points: 8, pokemonName: "超夢", displayNo: "8", bgClass: "bg-tiger" },
            "9分牌": { img: "/bite-game/9.png", points: 9, pokemonName: "甲賀忍蛙", displayNo: "9", bgClass: "bg-hunter" },
            "999分牌": { img: "/bite-game/00.png", points: 999, pokemonName: "百變怪", displayNo: "∞", bgClass: "bg-virus" }
        };

        function toggleBGM() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            bgmPlaying = !bgmPlaying;
            const btn = document.getElementById('music-toggle-btn');

            if (bgmPlaying) {
                btn.innerText = '關閉音樂';
                btn.style.backgroundColor = '#E53E3E';
                startBGM();
            } else {
                btn.innerText = '開啟音樂';
                btn.style.backgroundColor = '#3B4CCA';
                stopBGM();
            }
        }

        function startBGM() {
            if (bgmInterval) clearInterval(bgmInterval);
            const chordNotes = [
                [261.63, 329.63, 392.00],
                [220.00, 261.63, 329.63],
                [174.61, 220.00, 261.63],
                [196.00, 246.94, 293.66]
            ];
            let step = 0;

            bgmInterval = setInterval(() => {
                if (!bgmPlaying) return;
                const notes = chordNotes[step % chordNotes.length];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.1);

                    gain.gain.setValueAtTime(0.03, audioCtx.currentTime + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + idx * 0.1 + 1.2);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(audioCtx.currentTime + idx * 0.1);
                    osc.stop(audioCtx.currentTime + idx * 0.1 + 1.5);
                });
                step++;
            }, 2500);
        }

        function stopBGM() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            if (type === 'win') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.08);
                    
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime + index * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + index * 0.08 + 0.2);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start(audioCtx.currentTime + index * 0.08);
                    osc.stop(audioCtx.currentTime + index * 0.08 + 0.25);
                });
            } else if (type === 'lose') {
                const notes = [300, 240, 180];
                notes.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.15);
                    
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime + index * 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + index * 0.15 + 0.3);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start(audioCtx.currentTime + index * 0.15);
                    osc.stop(audioCtx.currentTime + index * 0.15 + 0.35);
                });
            }
        }

        socket.on('connect', () => { myId = socket.id; });

        socket.on('update_room_list', (rooms) => {
            const container = document.getElementById('room-list-container');
            if (rooms.length === 0) {
                container.innerHTML = `<p style="color: #A0AEC0; font-size: 14px;">目前沒有等待中的房間...</p>`;
                return;
            }

            container.innerHTML = rooms.map(r => `
                <div class="room-item">
                    <span style="font-size: 15px;">房間：${r.hostName} (${r.playerCount}人)</span>
                    <button onclick="joinSpecificRoom('${r.code}')" style="padding: 6px 12px; margin: 0; font-size: 14px; background-color: #3182CE;">加入</button>
                </div>
            `).join('');
        });

        function createRoom() {
            const name = document.getElementById('player-name').value.trim();
            if (!name) return alert('請先輸入你的玩家暱稱！');
            socket.emit('create_room', name);
        }

        function joinSpecificRoom(code) {
            const name = document.getElementById('player-name').value.trim();
            if (!name) return alert('請先在上方輸入暱稱再點擊加入！');
            myRoomCode = code;
            socket.emit('join_room', { roomCode: code, playerName: name });
        }

        socket.on('room_created', (data) => {
            myRoomCode = data.roomCode;
            showGameUI();
            document.getElementById('host-controls').style.display = 'block';
        });

        socket.on('update_players', (players) => {
            if (document.getElementById('game-box').style.display === 'none') showGameUI();
            cachedPlayers = players;
            renderUI();
        });

        socket.on('sync_players', (data) => {
            clearTurnTimers();
            hideGroupVotePanel();
            cachedPlayers = data.players;
            currentTurnId = data.currentTurnId;
            
            if (!cachedPlayers.some(p => p.id === selectedTargetId && p.id !== myId)) {
                selectedTargetId = null;
            }

            renderUI();
            startTurnTimer();
        });

        socket.on('game_started_signal', () => {
            document.getElementById('host-controls').style.display = 'none';
        });

        socket.on('start_group_vote', (data) => {
            document.getElementById('group-vote-panel').style.display = 'block';
            document.getElementById('group-vote-text').innerText = `${data.initiator} 發起圍毆 ${data.targetName}！`;
            startGroupTimer();
        });

        socket.on('prompt_group_vote', (data) => {
            document.getElementById('group-vote-panel').style.display = 'block';
            document.getElementById('group-vote-text').innerText = `提醒：${data.initiator} 正在圍毆 ${data.targetName}，是否參加？`;
            document.getElementById('vote-buttons').style.display = 'block';
        });

        socket.on('append_log', (msg) => {
            const log = document.getElementById('battle-log');
            log.innerHTML = msg + '<br><br>' + log.innerHTML;
        });

        socket.on('play_sound', (type) => { playSound(type); });

        socket.on('game_over', (players) => {
            clearTurnTimers();
            hideGroupVotePanel();
            stopBGM();
            
            players.sort((a, b) => b.score - a.score);
            
            const listContainer = document.getElementById('game-over-list');
            listContainer.innerHTML = players.map((p, idx) => {
                let winRate = (p.totalBattles > 0) ? Math.round((p.wins / p.totalBattles) * 100) : 0;
                return `
                    <div style="background: #F7F9FA; margin: 8px 0; padding: 12px; border-radius: 12px; border: 1px solid #E2E8F0;">
                        <div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 17px; color: #2D3748;">
                            <span>第 ${idx+1} 名：${p.name}</span>
                            <span style="color: #3182CE;">得分: ${p.score}</span>
                        </div>
                        <div style="font-size: 14px; color: #4A5568; margin-top: 6px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px;">
                            <div>勝率：${winRate}% (${p.wins}/${p.totalBattles})</div>
                            <div>發起圍毆：${p.groupAttackCount} 次</div>
                            <div>棄牌(Pass)：${p.passCount} 次</div>
                            <div>發動技能：${p.skillCount} 次</div>
                        </div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('game-over-modal').style.display = 'flex';
        });

        socket.on('error_message', (msg) => { alert(msg); });

        function showGameUI() {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('game-box').style.display = 'block';
        }

        function startGame() { socket.emit('start_game', myRoomCode); }

        function selectTarget(targetId) {
            if (currentTurnId !== myId) return; 
            if (targetId === myId) return; 

            selectedTargetId = targetId;
            renderUI(); 
        }

        function sendAction(actionType) {
            clearTurnTimers();
            let targetId = selectedTargetId;
            if (actionType === 'attack' || actionType === 'group_attack') {
                if (!targetId) return alert('請先點選畫面中要攻擊的玩家名字作為目標！');
            }
            socket.emit('player_action', { roomCode: myRoomCode, actionType, targetId });
        }

        function voteGroup(join) {
            socket.emit('respond_group', { roomCode: myRoomCode, join });
            document.getElementById('vote-buttons').style.display = 'none';
            document.getElementById('group-vote-text').innerText = join ? '已選擇參加圍毆！等待結算...' : '已選擇不參加圍毆。';
        }

        function clearTurnTimers() {
            if (turnTimer) clearTimeout(turnTimer);
            if (countdownTimer) clearInterval(countdownTimer);
        }

        function hideGroupVotePanel() {
            document.getElementById('group-vote-panel').style.display = 'none';
            document.getElementById('vote-buttons').style.display = 'none';
            if (groupVoteTimer) clearTimeout(groupVoteTimer);
            if (groupCountdownTimer) clearInterval(groupCountdownTimer);
        }

        function startTurnTimer() {
            if (currentTurnId === myId) {
                timeLeft = 10;
                document.getElementById('timer-text').innerText = `${timeLeft}s`;
                
                countdownTimer = setInterval(() => {
                    timeLeft--;
                    if (timeLeft >= 0) {
                        document.getElementById('timer-text').innerText = `${timeLeft}s`;
                    }
                }, 1000);

                turnTimer = setTimeout(() => {
                    clearTurnTimers();
                    if (currentTurnId === myId) {
                        socket.emit('timeout_action', { roomCode: myRoomCode });
                    }
                }, 10000);
            }
        }

        function startGroupTimer() {
            groupTimeLeft = 5;
            document.getElementById('group-timer-text').innerText = `剩餘考慮時間：${groupTimeLeft} 秒`;

            if (groupCountdownTimer) clearInterval(groupCountdownTimer);
            groupCountdownTimer = setInterval(() => {
                groupTimeLeft--;
                if (groupTimeLeft >= 0) {
                    document.getElementById('group-timer-text').innerText = `剩餘考慮時間：${groupTimeLeft} 秒`;
                }
            }, 1000);

            if (groupVoteTimer) clearTimeout(groupVoteTimer);
            groupVoteTimer = setTimeout(() => {
                hideGroupVotePanel();
            }, 5000);
        }

        function renderUI() {
            const list = document.getElementById('game-player-list');
            const foxBanner = document.getElementById('fox-status-banner');
            const actionPanel = document.getElementById('action-panel');
            const targetInstruction = document.getElementById('target-instruction');
            const cardDisplay = document.getElementById('card-display');

            let maxFoxTurns = 0;
            cachedPlayers.forEach(p => {
                if (p.id !== myId && p.foxVisionTurnsLeft > maxFoxTurns) {
                    maxFoxTurns = p.foxVisionTurnsLeft;
                }
            });

            if (maxFoxTurns > 0) {
                foxBanner.innerText = `【看透你了】特權生效中：看穿所有對手手牌 (剩餘 ${maxFoxTurns} 個回合)`;
            } else {
                foxBanner.innerText = '';
            }

            list.innerHTML = cachedPlayers.map(p => {
                let isMyTurn = (p.id === currentTurnId);
                
                let displayHtml = '<span class="list-score-tag">?</span>';
                if (p.card) {
                    let pokeData = pokemonDataMapping[p.card.name] || { img: '', points: p.card.points, bgClass: 'bg-rabbit' };
                    displayHtml = `<div class="pokemon-mini-container"><img src="${pokeData.img}" class="pokemon-mini-img" alt="card"></div><span class="list-score-tag">${pokeData.displayNo || pokeData.points}</span>`;
                }

                let isClickable = (currentTurnId === myId && p.id !== myId);
                let isSelected = (p.id === selectedTargetId);
                let liClasses = [];
                if (isMyTurn) liClasses.push('turn-highlight');
                if (isClickable) liClasses.push('clickable-player');
                if (isSelected) liClasses.push('selected-target');

                let attackIconHtml = (currentTurnId === myId && p.id !== myId) ? '<img src="/bite-game/hit.png" style="width: 22px; height: 22px; margin-right: 6px; vertical-align: middle;" alt="hit">' : '';

                return `
                    <li class="${liClasses.join(' ')}" ${isClickable ? `onclick="selectTarget('${p.id}')"` : ''}>
                        <div style="display: flex; align-items: center;">
                            ${attackIconHtml}
                            ${displayHtml}
                            <span class="list-player-name">${p.name}</span>
                        </div>
                        <div class="list-right-group">
                            <span class="list-total-score">【得分: ${p.score}】</span>
                            ${isMyTurn ? '<span style="color:#D69E2E; font-weight:700; font-size: 1.2rem;">回合中</span>' : ''}
                        </div>
                    </li>`;
            }).join('');

            const me = cachedPlayers.find(p => p.id === myId);
            if (me && me.card) {
                let pokeData = pokemonDataMapping[me.card.name] || { img: '', points: me.card.points, bgClass: 'bg-rabbit' };
                cardDisplay.innerHTML = `
                    <div class="card-container-wrapper ${pokeData.bgClass}">
                        <img src="${pokeData.img}" class="pokemon-card-img" alt="card">
                    </div>
                    <div style="display: flex; flex-direction: column; align-items: flex-start; text-align: left; margin-left: 6px;">
                        <div class="pokemon-name" style="font-size: 19px; line-height: 1.2;">${pokeData.pokemonName || ''}</div>
                        <div class="din-score" style="font-size: 48px; color: #D53F8C;">${pokeData.displayNo || pokeData.points}</div>
                    </div>
                `;
            }
            
            if (currentTurnId === myId) {
                actionPanel.style.display = 'block';
                if (selectedTargetId) {
                    let targetObj = cachedPlayers.find(p => p.id === selectedTargetId);
                    targetInstruction.innerHTML = `<img src="/bite-game/hit.png" style="width: 18px; height: 18px; vertical-align: middle; margin-right: 4px;" alt="hit"> 已選擇對手：<strong style="color: #2C5282;">${targetObj ? targetObj.name : '未知'}</strong>`;
                    targetInstruction.style.color = '#2B6CB0';
                } else {
                    targetInstruction.innerHTML = `<img src="/bite-game/hit.png" style="width: 18px; height: 18px; vertical-align: middle; margin-right: 4px;" alt="hit"> 選擇對手`;
                    targetInstruction.style.color = '#E53E3E';
                }
            } else {
                actionPanel.style.display = 'none';
            }
        }
    </script>
</body>
</html>
